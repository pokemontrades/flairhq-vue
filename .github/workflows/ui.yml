name: UI

on:
  push:
    branches: [main]
    paths:
      - "flairhq-vue/**"
      - ".github/workflows/ui.yml"
  # Run manually from any branch: Actions → UI → Run workflow → pick a branch
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/flairhq-vue

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only main moves the :latest tag; other branches publish under their own name
      - name: Compute image tags
        id: meta
        run: |
          BRANCH="${GITHUB_REF_NAME//\//-}"
          if [ "$BRANCH" = "main" ]; then
            echo "tags=${IMAGE}:latest,${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${BRANCH},${IMAGE}:${BRANCH}-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./flairhq-vue
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          tags: ${{ steps.meta.outputs.tags }}

  # ── Auto-deploy (disabled) ────────────────────────────────────────────────
